    <rect x="292" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="298" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9654;</text>
    <rect x="318" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="324" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9724;</text>
    <rect x="344" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="352" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#8635;</text>
  </g>

  <!-- Card 5: JetKVM Rack 1 -->
  <g transform="translate(404, 292)">
    <rect width="388" height="228" rx="8" fill="#12121a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="1" y="1" width="386" height="226" rx="8" fill="#000"/>
    <!-- Proxmox-like UI -->
    <rect x="40" y="50" width="60" height="150" fill="#2b3e50"/>
    <rect x="100" y="50" width="248" height="150" fill="#1a2332"/>
    <text x="48" y="72" font-family="monospace" font-size="8" fill="#8cc4ff">Datacenter</text>
    <text x="52" y="87" font-family="monospace" font-size="8" fill="#e0e0e0">pve-node1</text>
    <text x="52" y="100" font-family="monospace" font-size="7" fill="#22c55e">&#9679; VM 100</text>
    <text x="52" y="112" font-family="monospace" font-size="7" fill="#22c55e">&#9679; VM 101</text>
    <text x="52" y="124" font-family="monospace" font-size="7" fill="#ef4444">&#9679; VM 102</text>
    <text x="52" y="136" font-family="monospace" font-size="7" fill="#22c55e">&#9679; CT 200</text>
    <text x="110" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#8cc4ff">Summary - pve-node1</text>
    <text x="110" y="92" font-family="monospace" font-size="8" fill="#888">CPU Usage: 23%</text>
    <rect x="110" y="96" width="120" height="6" rx="3" fill="#333"/>
    <rect x="110" y="96" width="28" height="6" rx="3" fill="#22c55e"/>
    <text x="110" y="117" font-family="monospace" font-size="8" fill="#888">Memory: 48.2 / 128 GB</text>
    <rect x="110" y="121" width="120" height="6" rx="3" fill="#333"/>
    <rect x="110" y="121" width="45" height="6" rx="3" fill="#3b82f6"/>
    <!-- Header -->
    <rect x="1" y="1" width="386" height="32" rx="8" fill="rgba(0,0,0,0.6)"/>
    <rect x="1" y="20" width="386" height="13" fill="rgba(0,0,0,0.6)"/>
    <rect x="12" y="8" width="50" height="18" rx="4" fill="#3b82f6"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">JETKVM</text>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e0e0e0">JetKVM - Rack 1</text>
  </g>

  <!-- Card 6: JetKVM Rack 2 -->
  <g transform="translate(800, 292)">
    <rect width="392" height="228" rx="8" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <rect x="1" y="1" width="390" height="226" rx="8" fill="#000"/>
    <!-- TrueNAS-like UI -->
    <rect x="40" y="50" width="310" height="150" fill="#1a1f2e"/>
    <rect x="40" y="50" width="60" height="150" fill="#0f1420"/>
    <text x="48" y="72" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6" font-weight="600">TrueNAS</text>
    <text x="48" y="87" font-family="monospace" font-size="7" fill="#888">Dashboard</text>
    <text x="48" y="100" font-family="monospace" font-size="7" fill="#888">Storage</text>
    <text x="48" y="113" font-family="monospace" font-size="7" fill="#888">Network</text>
    <text x="48" y="126" font-family="monospace" font-size="7" fill="#888">Shares</text>
    <text x="110" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0" font-weight="500">Dashboard</text>
    <text x="110" y="92" font-family="monospace" font-size="8" fill="#888">Pool: tank - HEALTHY</text>
    <text x="110" y="107" font-family="monospace" font-size="8" fill="#888">Used: 42.3 TB / 96 TB</text>
    <rect x="110" y="111" width="120" height="6" rx="3" fill="#333"/>
    <rect x="110" y="111" width="53" height="6" rx="3" fill="#22c55e"/>
    <text x="110" y="132" font-family="monospace" font-size="8" fill="#888">Uptime: 47d 12h 33m</text>
    <!-- Header -->
    <rect x="1" y="1" width="390" height="32" rx="8" fill="rgba(0,0,0,0.6)"/>
    <rect x="1" y="20" width="390" height="13" fill="rgba(0,0,0,0.6)"/>
    <rect x="12" y="8" width="50" height="18" rx="4" fill="#3b82f6"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">JETKVM</text>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e0e0e0">JetKVM - Rack 2</text>
