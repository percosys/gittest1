    <text x="18" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">PIKVM</text>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e0e0e0">PiKVM - Host 3</text>
    <circle cx="284" cy="17" r="5" fill="#22c55e"/>
    <rect x="296" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="302" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9654;</text>
    <rect x="322" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="328" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9724;</text>
    <rect x="348" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="356" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#8635;</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: PiKVM Host 4 (powered off) -->
  <g transform="translate(8, 292)">
    <rect width="388" height="228" rx="8" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <rect x="1" y="1" width="386" height="226" rx="8" fill="#000"/>
