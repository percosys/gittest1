    <text x="50" y="80" font-family="monospace" font-size="10" fill="#22c55e">[  OK  ] Started Network Manager.</text>
    <text x="50" y="95" font-family="monospace" font-size="10" fill="#22c55e">[  OK  ] Reached target Network.</text>
    <text x="50" y="110" font-family="monospace" font-size="10" fill="#22c55e">[  OK  ] Started Docker Application...</text>
    <text x="50" y="125" font-family="monospace" font-size="10" fill="#22c55e">[  OK  ] Started SSH Server.</text>
    <text x="50" y="145" font-family="monospace" font-size="10" fill="#e0e0e0">server02 login: _</text>
    <!-- Header overlay -->
    <rect x="1" y="1" width="386" height="32" rx="8" fill="rgba(0,0,0,0.6)"/>
    <rect x="1" y="20" width="386" height="13" fill="rgba(0,0,0,0.6)"/>
    <rect x="12" y="8" width="45" height="18" rx="4" fill="#8b5cf6"/>
    <text x="18" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">PIKVM</text>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e0e0e0">PiKVM - Host 2</text>
    <circle cx="280" cy="17" r="5" fill="#22c55e"/>
    <rect x="292" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="298" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9654;</text>
    <rect x="318" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="324" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9724;</text>
    <rect x="344" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="352" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#8635;</text>
  </g>

  <!-- Card 3: PiKVM Host 3 -->
  <g transform="translate(800, 56)">
    <rect width="392" height="228" rx="8" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <rect x="1" y="1" width="390" height="226" rx="8" fill="#000"/>
    <!-- Windows desktop -->
