    <text x="140" y="130" font-family="system-ui, sans-serif" font-size="28" fill="white" opacity="0.3">&#8862;</text>
    <text x="130" y="155" font-family="system-ui, sans-serif" font-size="10" fill="white" opacity="0.5">Windows Server 2022</text>
