<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d0d15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Header bar -->
  <rect width="1200" height="48" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
  <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">KVM Dashboard</text>
  <rect x="155" y="16" width="65" height="20" rx="10" fill="#1e1e2e"/>
  <text x="170" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#888">6 devices</text>

  <!-- Status indicator -->
  <circle cx="1060" cy="24" r="4" fill="#22c55e" opacity="0.8"/>
  <text x="1070" y="29" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Live</text>
  <rect x="1110" y="12" width="75" height="26" rx="6" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <text x="1122" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#e0e0e0">Auto Grid</text>

  <!-- Grid: 3 columns x 2 rows -->
  <!-- Row 1 -->
  <!-- Card 1: PiKVM Host 1 -->
  <g transform="translate(8, 56)">
    <rect width="388" height="228" rx="8" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Feed area (dark) -->
    <rect x="1" y="1" width="386" height="226" rx="8" fill="#000"/>
    <!-- Simulated screen content -->
    <rect x="40" y="50" width="308" height="150" fill="#0c1425" rx="2"/>
    <text x="60" y="90" font-family="monospace" font-size="11" fill="#4a9eff">BIOS Setup Utility</text>
    <text x="60" y="110" font-family="monospace" font-size="10" fill="#888">Main  Advanced  Boot  Security  Exit</text>
    <text x="60" y="135" font-family="monospace" font-size="10" fill="#e0e0e0">System Time    [14:23:05]</text>
    <text x="60" y="150" font-family="monospace" font-size="10" fill="#e0e0e0">System Date    [03/09/2026]</text>
    <text x="60" y="170" font-family="monospace" font-size="10" fill="#e0e0e0">CPU Type       Intel Xeon E-2388G</text>
    <text x="60" y="185" font-family="monospace" font-size="10" fill="#e0e0e0">Total Memory   128 GB</text>
    <!-- Header overlay -->
    <rect x="1" y="1" width="386" height="32" rx="8" fill="rgba(0,0,0,0.6)"/>
    <rect x="1" y="20" width="386" height="13" fill="rgba(0,0,0,0.6)"/>
    <rect x="12" y="8" width="45" height="18" rx="4" fill="#8b5cf6"/>
    <text x="18" y="21" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white" text-transform="uppercase">PIKVM</text>
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e0e0e0">PiKVM - Host 1</text>
    <!-- Power LED (green = on) -->
    <circle cx="280" cy="17" r="5" fill="#22c55e"/>
    <!-- Power buttons -->
    <rect x="292" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="298" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9654;</text>
    <rect x="318" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="324" y="21" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#9724;</text>
    <rect x="344" y="6" width="22" height="22" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="352" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#e0e0e0">&#8635;</text>
  </g>

  <!-- Card 2: PiKVM Host 2 -->
